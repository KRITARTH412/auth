services:
  # Backend Web Service
  - type: web
    name: auth-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: LOG_LEVEL
        value: info

  # Frontend Static Site
- type: web
  name: auth-frontend
  runtime: static
  plan: free
  branch: main
  rootDir: frontend
  buildCommand: npm install && npm run build
  staticPublishPath: build
  routes:
    - type: rewrite
      source: /*
      destination: /index.html
  envVars:
    - key: REACT_APP_API_URL
      sync: false
